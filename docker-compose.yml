version: '3.8'

services:
  db:
    image: mysql:8.0
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DB}
    ports:
      - "3306:3306"

  app:
    image: biojj/voting-management-system-api
    container_name: voting-management-system-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - spring.datasource.url=jdbc:mysql://db:3306/${DB_DB}?useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.username=${DB_USER}
      - spring.datasource.password=${DB_PASSWORD}
      - spring.jpa.hibernate.ddl-auto=update
      - jwt.secret=gerartoken
      - jwt.expiration=180000
      - API.CPF.KEY=${API_CPF_KEY}
      - CPF.VALIDATION.API.URL=${CPF_VALIDATION_API_URL}
    depends_on:
      - db

volumes:
  db_data:
    driver: local
